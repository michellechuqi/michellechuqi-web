<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Filtering MapLibre: Road crashes in Adelaide</title>
    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"/>
  </head>
  <body>
    <!-- The web map will go in this div element. -->
    <div id="mapid" style="width: 600px; height: 400px;"></div>
    <div id="controls" style="margin:15px;">
      <button id:"showAllCrashesButton">Show All Crashes</button>
      <span style="display: inline-block; width: 30px;"></span>

      <input type="number" id="highlightFatalitiesEntry" placeholder="0 or 1">
      <button id="highlightFatalitiesButton">Highlight Fatality Status</button>
    </div>

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

      // Make a map with new maplibregl.Map(), and keep it in the variable map.
      const map = new maplibregl.Map({
        container: 'mapid',                  
        center: [138.599, -34.934],          // [longitude, latitude] of Adelaide, South Australia
        zoom: 12,
        style: 'https://tiles.openfreemap.org/styles/liberty'   
      });

      window.map = map;

      // raw url of crashes data
      const url = 'https://raw.githubusercontent.com/michellechuqi/michellechuqi-web/main/filtering-maplibre/RoadCrashes_2021_2025_GDA2020.geojson';
      
      // paint of crash symbols
      const crashesPaint = {
        // zoom expression
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 3, 17, 9],
        // colour depends on if crash had fatalities ('cse_fat' = 1) or not
        'circle-color': ['match', ['get', 'cse_fat'],
                          1, '#d64627', // YES, red
                          0, '#276bd6', // NO, blue
                          '#a0bff0'], // otherwise light blue
        'circle-opacity': 0.6
      };

      // adding crash data
      function addCrashes() {
        if (map.getSource('crashes')) {
          return;
        };
        map.addSource('crashes', {
          type: 'geojson',
          data: url,
          attribution: 'Road Crash Locations in SA, 2021-2025'
        });
        map.addLayer({
          id: 'crash-circles',
          type: 'circle',
          source: 'crashes',
          paint: crashesPaint
        });
      };

      // to draw all crashes when showAllCrashesButton is pressed:
      function showAllCrashes() {
        addCrashes();
        // set null filter:
        map.setFilter('crash-circles', null); // resets any filters that might have been applied
        map.setPaintProperty('crash-circles', 'circle-color', crashesPaint['circles-color']);
        map.setPaintProperty('crash-circles', 'circle-opacity', crashesPaint['circles-opacity']);
      };

      // to draw only highlighted crashes matching highlightFatalitiesEntry:
       function showHighlightedCrashes() {
        addCrashes(); // first add all crashes
        const textEntry = document.getElementById('highlightFatalitiesEntry');
        const crashTypeToHighlight = textEntry.value;
        if (entranceToHighlight === '') {
          showAllCrashes();
          return;
        }
        map.setFilter('crash-circles', ['in', crashTypeToHighlight, ['get', 'cse_fat']]);
        map.setPaintProperty('crash-circles', 'circle-color', ['case', matches, '#ff6900', '#875f36']);
        map.setPaintProperty('crash-circles', 'circle-opacity', ['case', matches, 0.9, 0.7]);
       }

      // making popups
      function onEachCrash(event) {
        const crash = event.features[0];
        const coordinates = crash.geometry.coordinates;
        const totalFatalities = crash.properties.total_fatalities;

        const popup = new maplibregl.Popup();
        popup.setLngLat(event.lngLat);
        popup.setText(
          `Coordinates: ${coordinates[0]}, ${coordinates[1]}
          \nTotal fatalities: ${totalFatalities}`
        );
        popup.addTo(map);
      };




      // load the crash layer 
      // REPLACE
      map.on('load', function () {
        addCrashes()
      })

      // load popups
      map.on('click', 'crash-circles', onEachCrash);
    
      // buttons work only once map layer is fully loaded
      // add listener per button
      map.on('load', function() {
        const showAllButton = document.getElementById('showAllCrashesButton');
        showAllButton.addEventListener('click', showAllCrashes);
        const highlightButton = document.getElementById('highlightFatalitiesButton');
        highlightButton.addEventListener('click', showHighlightedCrashes);
      });
      


    </script>
  </body>
</html>
