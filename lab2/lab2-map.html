<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>Lab 2 Map: Conflicting territories in the South China Sea</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
    <!-- Load Turf's code (JavaScript). After this line, the code on the page can use the name turf. -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>
  </head>

  <body>
    <!-- div element for web map: -->
    <div id="mapid" style="width: 800px; height: 500px;"></div>
    <!-- div element for territory buttons -->
     <!-- knowledge of flexbox from: https://www.w3schools.com/css/css3_flexbox.asp -->
    <div id="buttons" style=" 
        width: 800px;
        margin: 15px 0;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        ">
        <button id="china-territory">Declare China's territory</button>
        <button id="vietnam-territory">Declare Vietnam's territory</button>
        <button id="philippines-territory">Declare the Philippines' territory</button>
        <button id="toggle-fill">Show Fill View</button>
    </div>
    

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

// Setting up the map
      // the box that will hold the Voronoi cells: [west, south, east, north], in degrees.
      const box = [86.6, -14, 140.8, 31.3]; // bounds around South China Sea, from Google Maps
      // westmost lon: 86.6
      // southmost lat: -14
      // eastmost lon: 140.8
      // northmost lat: 31.3

      // make a map with new maplibregl.Map(), and keep it in the variable map.
      const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        maxBounds: box,                      // the map cannot be moved outside the box
        center: [115.3, 10.6],               // [longitude, latitude] of the contested Spratly Islands
        zoom: 5,
        style: 'https://styles.maptoolkit.org/light.json'   // a free style from maptoolkit
      });

      // a module keeps its names to itself. This line lets you type map in the console under the code.
      window.map = map;

// Making arrays where new points are pushed into them

      // separate arrays for each of the three countries. 
      const clickedPointsChina = [];
      const clickedPointsVietnam = [];
      const clickedPointsPhilippines = [];

     // make variable called country
     // before a button is clicked, country is null (= 'no country')
     // let vs const from: https://www.freecodecamp.org/news/var-let-and-const-whats-the-difference/
      let country = null;

// Wait for map style to load. Everything afterwards happens after style loads:
map.on('load', function () {
    // China's layer is populated and has a style, prepares for fill view
    // addLayer and addSource from: https://maplibre.org/maplibre-gl-js/docs/API/classes/Map/#addlayer
     map.addSource('china-cells', { 
        type: 'geojson',
        data: turf.featureCollection([]) // declare blank array
     });
     map.addLayer({
        id: 'china-line',
        type: 'line',
        source: 'china-cells',
        paint: {
            'line-color': '#a877d1', // purple
            'line-width': 3
        }
    });
    map.addLayer({
        id: 'china-fill',
        type: 'fill',
        source: 'china-cells',
        paint: {
            'fill-color': '#a877d1',
            'fill-opacity': 0.3
        },
        layout: {
            visibility: 'none' // this layer is initially hidden
        }
    });
    map.addSource('china-points', {
        type: 'geojson',
        data: turf.featureCollection([])
    });
    map.addLayer({
        id: 'china-circles',
        type: 'circle',
        source: 'china-points',
        paint: {
            'circle-radius': 4,
            'circle-color': '#a877d1'
        }
    });

    // Vietnam
    map.addSource('vietnam-cells', { 
        type: 'geojson',
        data: turf.featureCollection([]) // declare blank array
     });
     map.addLayer({
        id: 'vietnam-line',
        type: 'line',
        source: 'vietnam-cells',
        paint: {
            'line-color': '#d17777', // red
            'line-width': 3
        }
    });
    map.addLayer({
        id: 'vietnam-fill',
        type: 'fill',
        source: 'vietnam-cells',
        paint: {
            'fill-color': '#d17777',
            'fill-opacity': 0.3
        },
        layout: {
            visibility: 'none' // this layer is initially hidden
        }
    });
    map.addSource('vietnam-points', {
        type: 'geojson',
        data: turf.featureCollection([])
    });
    map.addLayer({
        id: 'vietnam-circles',
        type: 'circle',
        source: 'vietnam-points',
        paint: {
            'circle-radius': 4,
            'circle-color': '#d17777'
        }
    });
    

    // Philippines
    map.addSource('philippines-cells', { 
        type: 'geojson',
        data: turf.featureCollection([]) // declare blank array
     });
     map.addLayer({
        id: 'philippines-line',
        type: 'line',
        source: 'philippines-cells',
        paint: {
            'line-color': '#8cd177', // green
            'line-width': 3
        }
    });
    map.addLayer({
        id: 'philippines-fill',
        type: 'fill',
        source: 'philippines-cells',
        paint: {
            'fill-color': '#8cd177',
            'fill-opacity': 0.3
        },
        layout: {
            visibility: 'none' // this layer is initially hidden
        }
    });
    map.addSource('philippines-points', {
        type: 'geojson',
        data: turf.featureCollection([])
    });
    map.addLayer({
        id: 'philippines-circles',
        type: 'circle',
        source: 'philippines-points',
        paint: {
            'circle-radius': 4,
            'circle-color': '#8cd177'
        }
    });
    

// What happens when button is clicked (listeners, change in country value)
    document.getElementById('china-territory').addEventListener('click', function() {
        country = 'china';
        console.log('China selected') // able to verify in console that listener is working
    });
    document.getElementById('vietnam-territory').addEventListener('click', function() {
        country = 'vietnam';
        console.log('Vietnam selected')
    });
    document.getElementById('philippines-territory').addEventListener('click', function() {
        country = 'philippines';
        console.log('the Philippines selected')
    });

// After clicking a button, clicking on a map pushes that point to an array:
    map.on('click', function(e) {
        if (country === null) { // to prevent clicking on map without clicking on a country first
            console.log('Click on a country button first.');
            return;
        }

        // point syntax from: https://turfjs.org/docs/api/point
        const aPoint = turf.point([e.lngLat.lng, e.lngLat.lat], 
                                  {country: country}); 

        if (country === 'china') {
            clickedPointsChina.push(aPoint); // populate array
            map.getSource('china-points').setData(turf.featureCollection(clickedPointsChina)); // update points layer
        } else if (country === 'vietnam') {
            clickedPointsVietnam.push(aPoint);
            map.getSource('vietnam-points').setData(turf.featureCollection(clickedPointsVietnam));
        } else if (country === 'philippines') {
            clickedPointsPhilippines.push(aPoint);
            map.getSource('philippines-points').setData(turf.featureCollection(clickedPointsPhilippines));
        }

        console.log(country + ': ' + [e.lngLat.lng, e.lngLat.lat]); // console shows coordinates

// Making one Voronoi diagram with all points (regardless of their separate country identities)
        const combinedArray = turf.featureCollection([
            ...clickedPointsChina, // spread syntax (...) to make one array of all the points from: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Spread_syntax
            ...clickedPointsVietnam,
            ...clickedPointsPhilippines
        ]);
        const oneVoronoi = turf.voronoi(combinedArray, {bbox: box}); // make voronoi polygons

// Preparation for filtering: making filter helper functions:
        function checkChina(polygon, index) { // check each polygon if it belongs to china
            if (combinedArray.features[index].properties.country === 'china') {
                return true};
            return false
        };
        function checkVietnam(polygon, index) {
            if (combinedArray.features[index].properties.country === 'vietnam') {
                return true};
            return false
        };
        function checkPhilippines(polygon, index) {
            if (combinedArray.features[index].properties.country === 'philippines') {
                return true};
            return false
        };

// Separating resulting polygons by their country identities + updating sources
        const chinaPolygons = turf.featureCollection(
            oneVoronoi.features.filter(checkChina));
        const vietnamPolygons = turf.featureCollection(
            oneVoronoi.features.filter(checkVietnam));
        const philippinesPolygons = turf.featureCollection(
            oneVoronoi.features.filter(checkPhilippines));
        
        map.getSource('china-cells').setData(chinaPolygons);
        map.getSource('vietnam-cells').setData(vietnamPolygons);
        map.getSource('philippines-cells').setData(philippinesPolygons);
    
    });

// Responding to toggle button
    let fillVisible = false;
    document.getElementById('toggle-fill').addEventListener('click', function() { // when button is clicked,
        if (fillVisible === false) { // if originally set to false,
            map.setLayoutProperty('china-fill', 'visibility', 'visible'); // make fill layers visible
            map.setLayoutProperty('vietnam-fill', 'visibility', 'visible');
            map.setLayoutProperty('philippines-fill', 'visibility', 'visible');
        
            fillVisible = true; // update var's value
            document.getElementById('toggle-fill').textContent = 'Hide Fill View'; // update button text
        } else {
            map.setLayoutProperty('china-fill', 'visibility', 'none'); // make fill layers invisible
            map.setLayoutProperty('vietnam-fill', 'visibility', 'none');
            map.setLayoutProperty('philippines-fill', 'visibility', 'none');
        
            fillVisible = false;
            document.getElementById('toggle-fill').textContent = 'Show Fill View';

    }});
});
    </script>
  </body>
</html>
